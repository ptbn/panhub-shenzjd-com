name: PanHub CI / Regression & Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck, Security & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Offline Regression Tests
        run: npx vitest run --exclude "**/tg-fetch.test.ts" --exclude "**/tg-multipage.test.ts"

      - name: Verify Cloudflare Workers Module Build
        env:
          NITRO_PRESET: cloudflare_module
          NUXT_TELEMETRY_DISABLED: "1"
          CI: "true"
        run: npx nuxt build
